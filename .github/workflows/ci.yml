# Runs on every push and pull request: backend tests, frontend lint + build, and the browser tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bag_of_holding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bag_of_holding_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv install --dev --deploy
      - run: pipenv run test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bag_of_holding
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bag_of_holding
      FLASK_APP: src/app.py
      FLASK_DEBUG: "1"
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pipenv
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: pip install pipenv
      - run: pipenv install --dev --deploy
      - run: npm ci
      - name: Create the database tables
        run: pipenv run upgrade
      - name: Start the test servers
        run: |
          pipenv run e2e-api > api.log 2>&1 &
          npm run e2e:app > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100 && curl -s -o /dev/null http://localhost:3101/api/me && exit 0
            sleep 1
          done
          echo "Servers did not start"; cat api.log app.log; exit 1
      - run: npm run test:e2e
      - name: Server logs
        if: failure()
        run: cat api.log app.log
